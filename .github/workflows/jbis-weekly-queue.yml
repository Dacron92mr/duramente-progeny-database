name: JBIS monthly queue
on:
  schedule:
    # Four serial 30-profile batches daily through day 10, leaving retry/catch-up
    # capacity after the normal 23-batch cycle has time to finish.
    - cron: '17 3,9,15,21 1-10 * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Profiles to process (1-32)'
        default: '30'
        type: string
permissions:
  contents: write
  pages: write
concurrency:
  group: weekly-data-sync
  cancel-in-progress: false
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test safeguards
        run: python -m unittest discover -s scripts/tests -v
      - name: Process next JBIS batch
        env:
          JBIS_BATCH_SIZE: ${{ inputs.batch_size || '30' }}
        run: python scripts/weekly_sync.py --source jbis --jbis-limit "$JBIS_BATCH_SIZE" --apply --report "$RUNNER_TEMP/sync-report.json"
      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jbis-monthly-sync-report
          path: ${{ runner.temp }}/sync-report.json
          retention-days: 30
          if-no-files-found: warn
      - name: Commit validated batch
        id: commit
        run: |
          git add data index.html .github/sync/state.json
          if git diff --cached --quiet; then exit 0; fi
          site_changed=false
          if ! git diff --cached --quiet -- data index.html; then site_changed=true; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh validated JBIS monthly batch'
          python scripts/rebase_sync.py
          git push origin HEAD:main
          echo "changed=$site_changed" >> "$GITHUB_OUTPUT"
      - name: Request existing GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
