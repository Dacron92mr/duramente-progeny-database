<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>ドゥラメンテ产驹数据库</title>
  <link rel="icon" href="data:,">
  <script>
    (() => {
      let preference = "system";
      try { preference = localStorage.getItem("duramente-theme") || "system"; } catch {}
      const resolved = preference === "system"
        ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : preference;
      document.documentElement.dataset.theme = resolved;
      document.documentElement.dataset.themePreference = preference;
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=20261016-analysis">
</head>
<body>
  <a class="skip-link" href="#progenyView">跳至内容</a>
  <aside class="app-sidebar" id="appSidebar" aria-label="数据库导航">
    <a class="brand" href="./" aria-label="Duramente 数据库首页">
      <span class="brand-mark" aria-hidden="true">D</span>
      <span class="brand-copy"><strong>Duramente</strong><small>ドゥラメンテ · 大鸣大放</small></span>
    </a>
    <p class="sidebar-label">资料库</p>
    <nav class="main-nav" aria-label="主导航">
      <button class="active" type="button" data-view="progeny" title="产驹列表"><span class="nav-symbol" aria-hidden="true">▤</span><span class="nav-label">产驹列表</span></button>
      <button type="button" data-view="sire" title="种牡马生涯"><span class="nav-symbol" aria-hidden="true">▥</span><span class="nav-label">种牡马生涯</span></button>
      <button type="button" data-view="pedigree" title="血统分析"><span class="nav-symbol" aria-hidden="true">⋈</span><span class="nav-label">血统分析</span></button>
      <button type="button" data-view="production" title="生产与繁殖"><span class="nav-symbol" aria-hidden="true">♧</span><span class="nav-label">生产与繁殖</span></button>
      <button type="button" data-view="racecourse" title="赛马场"><span class="nav-symbol" aria-hidden="true">◎</span><span class="nav-label">赛马场</span></button>
    </nav>
    <section id="sidebarUpdates" class="sidebar-updates" aria-label="最近动态"></section>
    <div class="sidebar-footer">
      <div class="collection-note"><span class="sidebar-label">研究样本</span><strong id="collectionCount">产驹资料</strong><small>2018—2022 年出生世代</small></div>
      <a class="source-link" href="https://github.com/Dacron92mr/duramente-progeny-database" target="_blank" rel="noreferrer">资料来源与项目 ↗</a>
    </div>
  </aside>
  <header class="workspace-header">
    <button class="icon-button" id="sidebarToggle" type="button" aria-controls="appSidebar" aria-expanded="true" aria-label="折叠导航侧栏" title="折叠导航侧栏">☰</button>
    <span class="workspace-title">ドゥラメンテ产驹数据库</span>
    <label class="theme-picker"><span class="sr-only">外观</span><select id="themeMode" aria-label="外观模式"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
  </header>

  <main class="layout view active" id="progenyView" tabindex="-1" data-display="compact">
    <button class="filter-backdrop" id="filterBackdrop" type="button" aria-label="关闭筛选面板" hidden></button>
    <aside class="filters" id="filtersPanel" role="dialog" aria-modal="true" aria-label="产驹筛选" tabindex="-1" hidden>
      <div class="filters-head">
        <div><strong>筛选</strong><small>选择筛选条件</small></div>
        <button class="icon-button filter-close" id="filterClose" type="button" aria-label="关闭筛选面板">×</button>
      </div>
      <div class="filter-search-row">
        <label class="search">
          <span>搜索</span>
          <input id="search" type="search" placeholder="马名、母马、马主、练马师、生产牧场">
        </label>
        <button id="resetFilters" class="reset-filters" type="button">重置</button>
      </div>

      <details class="filter-group" open>
        <summary>基础</summary>
        <div class="filter-row">
          <label>
            <span>出生年</span>
            <select id="year">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            <span>性别</span>
            <select id="sex">
              <option value="">全部</option>
            </select>
          </label>
        </div>
        <div class="filter-row">
          <label>
            <span>毛色</span>
            <select id="color">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            <span>最高成就</span>
            <select id="achievement">
              <option value="">全部</option>
            </select>
          </label>
        </div>
      </details>

      <details class="filter-group">
        <summary>相关人员</summary>
        <div class="filter-row">
          <label>
            <span>所属</span>
            <select id="region">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            <span>练马师 · 含已核实历史所属</span>
            <select id="trainer">
              <option value="">全部</option>
            </select>
          </label>
        </div>
        <div class="filter-row">
          <label>
            <span>马主 · 含已核实历史所属</span>
            <select id="owner">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            <span>生产牧场</span>
            <select id="breeder">
              <option value="">全部</option>
            </select>
          </label>
        </div>
      </details>

      <details class="filter-group">
        <summary>血统</summary>
        <div class="filter-row">
          <label>
            <span>母父系</span>
            <select id="bmsLine">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            <span>母父</span>
            <select id="broodmareSire">
              <option value="">全部</option>
            </select>
          </label>
        </div>
        <div class="filter-row">
          <label>
            <span>牝系</span>
            <select id="femaleFamily">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            <span>生产时母龄</span>
            <select id="damAgeBucket">
              <option value="">全部</option>
            </select>
          </label>
        </div>
      </details>

      <details class="filter-group">
        <summary>退役后与繁殖</summary>
        <label>
          <span>繁殖状态</span>
          <select id="breeding">
            <option value="">全部</option>
          </select>
        </label>
      </details>
    </aside>

    <section class="content">
      <div id="discoveryOverview"></div>
      <div class="explorer-controls">
        <div class="search-field">
          <span class="search-symbol" aria-hidden="true">⌕</span>
          <label class="mobile-search"><span class="sr-only">搜索产驹</span><input id="mobileSearch" type="search" placeholder="日文、英文、香港译名或相关资料" aria-keyshortcuts="Meta+K Control+K"></label>
          <button id="clearSearch" type="button" aria-label="清除搜索" hidden>×</button><kbd aria-hidden="true">⌘ K</kbd>
        </div>
        <button id="filterOpen" class="filter-open" type="button" aria-controls="filtersPanel" aria-expanded="false">筛选 <span id="filterCountBadge">0</span></button>
        <div class="toolbar-actions">
          <select id="sort" aria-label="排序依据">
            <option value="earnings_netkeiba">奖金</option>
            <option value="birth_year">出生年</option>
            <option value="name">马名</option>
          </select>
          <button id="direction" type="button" aria-label="排序方向">↓</button>
        </div>
      </div>
      <div class="quick-filters" role="group" aria-label="快捷筛选">
        <button type="button" data-quick="" aria-pressed="true"><span>全部产驹</span></button>
        <button type="button" data-quick="g1" aria-pressed="false"><span>G1 冠军</span></button>
        <button type="button" data-quick="graded" aria-pressed="false"><span>重赏冠军（含 G1）</span></button>
        <button type="button" data-quick="hkjc" aria-pressed="false"><span>有香港译名</span></button>
        <button type="button" data-quick="breeding" aria-pressed="false"><span>有繁殖记录</span></button>
      </div>
      <details class="classification-note"><summary>等级分类说明</summary><p>快捷筛选沿用数据库的 G1、G2、G3 成就分类；中央、地方交流及海外赛事的具体级别见马匹详情。</p></details>
      <div class="active-filters" id="activeFilters" aria-live="polite"></div>

      <div class="toolbar">
        <div>
          <h2>产驹列表</h2>
          <p id="resultCount" role="status" aria-live="polite">正在载入产驹资料…</p>
        </div>
        <div class="table-tools">        <div class="display-modes" role="group" aria-label="列表显示模式"><button type="button" data-display-mode="compact" aria-pressed="true">紧凑</button><button type="button" data-display-mode="detailed" aria-pressed="false">详细</button></div>
        <button id="exportCsv" class="export-button" type="button" title="导出全部筛选结果，包含固定完整字段">导出 CSV</button></div>
      </div>
      <div class="table-wrap progeny-table-wrap" tabindex="0" role="region" aria-label="产驹数据表，可滚动">
        <table class="progeny-table">
          <caption class="sr-only">产驹资料；奖金单位为万日元，空缺以破折号显示。</caption>
          <thead>
            <tr>
              <th class="sticky-horse-head"><button class="sort-heading" type="button" data-table-sort="name">马名 <span aria-hidden="true"></span></button></th>
              <th><button class="sort-heading" type="button" data-table-sort="birth_year">出生年 <span aria-hidden="true"></span></button></th>
              <th scope="col">性别</th>
              <th scope="col" class="detail-only">毛色</th>
              <th scope="col" class="detail-only">所属</th>
              <th scope="col" class="detail-only">母马</th>
              <th scope="col" class="detail-only">牝系</th>
              <th scope="col" class="detail-only">母父</th>
              <th scope="col" class="detail-only">马主</th>
              <th scope="col" class="detail-only">练马师</th>
              <th class="money-heading"><button class="sort-heading" type="button" data-table-sort="earnings_netkeiba">賞金（万円） <span aria-hidden="true"></span></button></th>
              <th>主要胜鞍</th>
            </tr>
          </thead>
          <tbody id="horseRows"></tbody>
        </table>
      </div>
      <div class="horse-cards" id="horseCards" aria-live="polite"></div>

      <div class="pager">
        <label class="page-size">每页 <select id="pageSize" aria-label="每页显示数量"><option value="20">20</option><option value="50" selected>50</option><option value="100">100</option></select> 匹</label>
        <button id="prev" type="button" aria-label="上一页">‹</button>
        <span id="pageLabel" role="status"></span>
        <button id="next" type="button" aria-label="下一页">›</button>
      </div>
    </section>
  </main>

  <main tabindex="-1" class="analysis-shell view" id="sireView" hidden>
    <section class="analysis-page" id="sireContent"></section>
  </main>

  <main tabindex="-1" class="analysis-shell view" id="pedigreeView" hidden>
    <section class="analysis-page" id="pedigreeContent"></section>
  </main>

  <main tabindex="-1" class="analysis-shell view" id="productionView" hidden>
    <section class="analysis-page" id="productionContent"></section>
  </main>

  <main tabindex="-1" class="analysis-shell view" id="racecourseView" hidden>
    <section class="analysis-page" id="racecourseContent"></section>
  </main>


  <div class="drawer" id="drawer" aria-hidden="true">
    <button class="drawer-backdrop" id="closeBackdrop" type="button" aria-label="关闭详情"></button>
    <aside class="drawer-panel" id="drawerPanel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" tabindex="-1">
      <header id="drawerHeader" class="drawer-header"><div class="drawer-toolbar">
      <button class="icon-button close" id="closeDrawer" type="button" aria-label="关闭详情">×</button>
      <div class="drawer-nav" aria-label="产驹连续浏览">
        <button id="previousHorse" type="button">← 前一匹</button>
        <button id="nextHorse" type="button">后一匹 →</button>
      </div>
      <strong id="drawerCompactName"></strong></div></header>
      <div id="detail"></div>
    </aside>
  </div>

  <script src="chart-animation.js?v=20260907b"></script>
  <script>window.STATIC_DATA_BASE = "data"; window.STATIC_DATA_VERSION = "20261023-sidebar-news";</script>
  <script src="chart-colors.js?v=20261007-semantic"></script>
  <script src="chart-analysis.js?v=20261016-analysis"></script>
  <script src="chart-design.js?v=20261016-analysis"></script>
  <script src="horse-relatives.js?v=20261007-semantic"></script>
  <script type="module" src="app.js?v=20261019-discovery"></script>
  <div id="actionStatus" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
