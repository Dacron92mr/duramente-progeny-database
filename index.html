<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>ドゥラメンテ产驹数据库</title>
  <link rel="icon" href="data:,">
  <script>
    (() => {
      const preference = localStorage.getItem("duramente-theme") || "system";
      const resolved = preference === "system"
        ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : preference;
      document.documentElement.dataset.theme = resolved;
      document.documentElement.dataset.themePreference = preference;
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=20260904b">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="kicker">RACING DATABASE</p>
      <h1>ドゥラメンテ产驹数据库</h1>
    </div>
    <div class="topbar-actions">
      <nav class="main-nav" aria-label="主导航">
        <button class="active" type="button" data-view="progeny">产驹列表</button>
        <button type="button" data-view="sire">种牡马生涯</button>
        <button type="button" data-view="pedigree">血统分析</button>
        <button type="button" data-view="production">生产与繁殖</button>
        <button type="button" data-view="racecourse">赛马场</button>
        <button type="button" data-view="method">数据与方法</button>
      </nav>
      <label class="theme-picker">
        <span>外观</span>
        <select id="themeMode" aria-label="外观模式">
          <option value="system">跟随系统</option>
          <option value="light">浅色</option>
          <option value="dark">深色</option>
        </select>
      </label>
    </div>
  </header>

  <main class="layout view active" id="progenyView">
    <button class="filter-backdrop" id="filterBackdrop" type="button" aria-label="关闭筛选面板" hidden></button>
    <aside class="filters" id="filtersPanel" aria-label="产驹筛选">
      <div class="filters-head">
        <div><strong>筛选</strong><small>选择筛选条件</small></div>
        <button class="icon-button filter-close" id="filterClose" type="button" aria-label="关闭筛选面板">×</button>
      </div>
      <div class="filter-search-row">
        <label class="search">
          <span>搜索</span>
          <input id="search" type="search" placeholder="马名、母马、马主、练马师、生产牧场">
        </label>
        <button id="resetFilters" class="reset-filters" type="button">重置</button>
      </div>

      <details class="filter-group" open>
        <summary>基础</summary>
        <div class="filter-row">
          <label>
            <span>出生年</span>
            <select id="year">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            <span>性别</span>
            <select id="sex">
              <option value="">全部</option>
            </select>
          </label>
        </div>
        <div class="filter-row">
          <label>
            <span>毛色</span>
            <select id="color">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            <span>最高成就</span>
            <select id="achievement">
              <option value="">全部</option>
            </select>
          </label>
        </div>
      </details>

      <details class="filter-group" open>
        <summary>相关人员</summary>
        <div class="filter-row">
          <label>
            <span>所属</span>
            <select id="region">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            <span>练马师</span>
            <select id="trainer">
              <option value="">全部</option>
            </select>
          </label>
        </div>
        <div class="filter-row">
          <label>
            <span>马主</span>
            <select id="owner">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            <span>生产牧场</span>
            <select id="breeder">
              <option value="">全部</option>
            </select>
          </label>
        </div>
      </details>

      <details class="filter-group" open>
        <summary>血统</summary>
        <div class="filter-row">
          <label>
            <span>母父系</span>
            <select id="bmsLine">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            <span>母父</span>
            <select id="broodmareSire">
              <option value="">全部</option>
            </select>
          </label>
        </div>
        <div class="filter-row">
          <label>
            <span>牝系</span>
            <select id="femaleFamily">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            <span>生产时母龄</span>
            <select id="damAgeBucket">
              <option value="">全部</option>
            </select>
          </label>
        </div>
      </details>

      <details class="filter-group" open>
        <summary>退役后与繁殖</summary>
        <label>
          <span>繁殖状态</span>
          <select id="breeding">
            <option value="">全部</option>
          </select>
        </label>
      </details>
    </aside>

    <section class="content">
      <div class="mobile-query-bar">
        <label class="mobile-search">
          <span class="sr-only">搜索</span>
          <input id="mobileSearch" type="search" placeholder="马名、母马、马主、练马师、生产牧场">
        </label>
        <button id="filterOpen" class="filter-open" type="button" aria-controls="filtersPanel" aria-expanded="false">筛选 <span id="filterCountBadge">0</span></button>
      </div>
      <div class="toolbar">
        <div>
          <h2>产驹列表</h2>
          <p id="resultCount"></p>
        </div>
        <div class="toolbar-actions">
          <select id="sort">
            <option value="earnings_netkeiba">奖金</option>
            <option value="birth_year">出生年</option>
            <option value="name">马名</option>
          </select>
          <button id="direction" type="button" aria-label="排序方向">↓</button>
        </div>
      </div>

      <div class="active-filters" id="activeFilters" aria-live="polite"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="sticky-horse-head"><button class="sort-heading" type="button" data-table-sort="name">马名 <span aria-hidden="true"></span></button></th>
              <th><button class="sort-heading" type="button" data-table-sort="birth_year">出生年 <span aria-hidden="true"></span></button></th>
              <th>性别</th>
              <th>毛色</th>
              <th>所属</th>
              <th>母马</th>
              <th>牝系</th>
              <th>母父</th>
              <th>马主</th>
              <th>练马师</th>
              <th><button class="sort-heading" type="button" data-table-sort="earnings_netkeiba">奖金 <span aria-hidden="true"></span></button></th>
              <th>主要胜鞍</th>
            </tr>
          </thead>
          <tbody id="horseRows"></tbody>
        </table>
      </div>
      <div class="horse-cards" id="horseCards" aria-live="polite"></div>

      <div class="pager">
        <button id="prev" type="button" aria-label="上一页">‹</button>
        <span id="pageLabel"></span>
        <button id="next" type="button" aria-label="下一页">›</button>
      </div>
    </section>
  </main>

  <main class="analysis-shell view" id="sireView" hidden>
    <section class="analysis-page" id="sireContent"></section>
  </main>

  <main class="analysis-shell view" id="pedigreeView" hidden>
    <section class="analysis-page" id="pedigreeContent"></section>
  </main>

  <main class="analysis-shell view" id="productionView" hidden>
    <section class="analysis-page" id="productionContent"></section>
  </main>

  <main class="analysis-shell view" id="racecourseView" hidden>
    <section class="analysis-page" id="racecourseContent"></section>
  </main>

  <main class="analysis-shell view" id="methodView" hidden>
    <section class="analysis-page" id="methodContent"></section>
  </main>

  <div class="drawer" id="drawer" aria-hidden="true">
    <button class="drawer-backdrop" id="closeBackdrop" type="button" aria-label="关闭详情"></button>
    <aside class="drawer-panel" id="drawerPanel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" tabindex="-1">
      <button class="icon-button close" id="closeDrawer" type="button" aria-label="关闭详情">×</button>
      <div class="drawer-nav" aria-label="产驹连续浏览">
        <button id="previousHorse" type="button">← 前一匹</button>
        <button id="nextHorse" type="button">后一匹 →</button>
      </div>
      <div id="detail"></div>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="chart-animation.js?v=20260805b"></script>
  <script>window.STATIC_DATA_BASE = "data"; window.STATIC_DATA_VERSION = "20260904b";</script>
  <script src="app.js?v=20260904b"></script>
</body>
</html>
